      <h2>築古マンション一室 再生リフォーム</h2>
      <p>
      入居者が長く居住しており、退去時に50万円程度の修繕費が管理会社の見積もりとして提示されていました。
        しかし収益性不動産という観点では、すべてを鵜吞みにしてしまうと収益性が確保できなくなるため、
        丁寧な清掃を組み合わせることを提案しました。
        その結果、30万円でリフォームすることに成功。
        結果として20万円のコスト削減に貢献しました。  
      </p>

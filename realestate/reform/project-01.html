<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>築古マンション再生事例｜Space Factory Company</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<main>
  <h1>築古マンション一室 再生リフォーム</h1>

  <section>
    <h2>物件の課題</h2>
    <ul>
      <li>内装の老朽化</li>
      <li>想定賃料と、修繕費用が不一致</li>
      <li>長期の利用があり、居室内の全体的な劣化あり</li>
    </ul>
  </section>

  <section>
    <h2>再生方針</h2>
    <p>
      管理会社が主張するような全面的な交換は行わず、  
      水回り・床を中心に改修・清掃範囲を限定。  
      コストと賃料のバランスを重視しました。
    </p>
  </section>

  <section>
    <h2>施工前 / 施工後 / 方針の転換イメージ</h2>
    <p>
      <img src="/assets/images/realestate/reform/project-01/before.jpg"
           style="max-width:100%;height:auto;">
    </p>
    <p>
      <img src="/assets/images/realestate/reform/project-01/after.jpg"
           style="max-width:100%;height:auto;">
    </p>
     <h2>当初管理会社提示額（約50万円）に対してキッチンや換気扇の交換でなく、清掃で対応する等のコストダウンをおこない、結果として30万円（20万円のコストダウン）になりました。</h2>
    <p>
      <img src="/assets/images/realestate/reform/project-01/budget.jpg"
           style="max-width:100%;height:auto;">
    </p>
  </section>

  <nav>
    <a href="/realestate/reform/">← 再生・リフォーム一覧へ戻る</a>
  </nav>
</main>

</body>
</html>
